<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>🎲 Mestre</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
      <div id="lockscreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #E69A28; font-family: 'Cinzel', serif;">
        <div style="text-align: center; background: rgba(0,0,0,0.8); padding: 40px; border-radius: 10px; border: 1px solid #E69A28; box-shadow: 0 0 20px rgba(230, 154, 40, 0.3);">
          <h2 style="margin-bottom: 20px;">🛡️ ACESSO RESTRITO - ELTUREL</h2>
          <p style="color: #e0d5b7; margin-bottom: 20px;">Insira o código do grupo para liberar o diário:</p>
          <input type="password" id="inputSenha" style="padding: 10px; border-radius: 5px; border: 1px solid #E69A28; background: #333; color: white; text-align: center; font-size: 1.2em;">
          <br><br>
          <button onclick="verificarAcesso()" style="padding: 10px 30px; background: #E69A28; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
            DESBLOQUEAR
          </button>
          <p id="erroSenha" style="color: #ff4444; margin-top: 15px; display: none;">Código incorreto, aventureiro.</p>
        </div>
      </div>
    <div class="app">
      <aside class="sidebar">
        <div class="logo">🎲</div>

        <nav class="menu">
          <button class="menu-btn" onclick="loadDashboard()">📌</button>
          <button class="menu-btn" onclick="loadTimeline()">🕰️</button>
          <button class="menu-btn" onclick="loadPontosPrincipais()">⭐</button>
          <button class="menu-btn mestre-only" onclick="loadNPCList()">📜</button>
          <button class="menu-btn mestre-only" onclick="loadNPCCreator()">➕</button>
          <button class="menu-btn mestre-only" onclick="loadLocais()">🏰</button>
          <button class="menu-btn mestre-only" onclick="loadFaccoes()">🕯️</button>
		  <button class="menu-btn mestre-only" onclick="loadEncontros()">⚔️</button>
          <button class="menu-btn" onclick="loadLoja()">🏪</button>
        </nav>
      </aside>

      <main id="content">
        <h2>Bem-vindo, Mestre</h2>
        <p>Escolha uma seção no menu.</p>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">✕</span>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="npcModal" class="modal hidden">
      <div class="modal-content">
        <button class="close-btn" onclick="closeNPCModal()">✖</button>
        <div id="npcModalBody"></div>
      </div>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="gen_npcs.js"></script>
    <script src="data_loja.js"></script>
    <script src="linhaTemporal.js"></script>
    <script src="data_pontos_principais.js"></script>
    <script src="data_npcs.js"></script>
    <script src="descricoes_npcs.js"></script>
    <script src="data_locais.js"></script>
    <script src="data_faccoes.js"></script>
	<script src="data_monstros.js"></script>
	<script src="data_encontros.js"></script>
    <script src="script.js"></script>
  </body>
</html>
